<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>גיבוי נתונים</title>
<style>
  :root {
    --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --brand:#2563eb; --ok:#059669; --warn:#b45309; --bad:#dc2626;
  }
  * { box-sizing:border-box }
  body {
    margin:0; padding:2rem 1rem; background:var(--bg); color:var(--ink);
    font-family:Tahoma, Arial, sans-serif; font-size:16px; line-height:1.6;
    display:flex; justify-content:center;
  }
  .wrap { width:100%; max-width:640px }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:1rem;
    padding:1.75rem; box-shadow:0 1px 3px rgba(15,23,42,.06);
  }
  h1 { margin:0 0 .25rem; font-size:1.4rem }
  .sub { margin:0 0 1.5rem; color:var(--muted); font-size:.95rem }
  .center { text-align:center; padding:2rem 0 }
  button {
    font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer;
    border:0; border-radius:.6rem; padding:.8rem 1.6rem; background:var(--brand); color:#fff;
  }
  button:disabled { opacity:.5; cursor:default }
  button.ghost { background:#f1f5f9; color:var(--ink); border:1px solid var(--line);
                 font-weight:600; padding:.5rem 1rem; font-size:.9rem }
  .row { display:flex; justify-content:space-between; align-items:center;
         padding:.7rem 0; border-bottom:1px solid var(--line) }
  .row:last-child { border-bottom:0 }
  .row b { font-variant-numeric:tabular-nums }
  .log { background:#0f172a; color:#cbd5e1; border-radius:.6rem; padding:.9rem 1rem;
         font-family:Consolas, monospace; font-size:.85rem; line-height:1.7;
         white-space:pre-wrap; direction:ltr; text-align:left; margin-top:1.25rem;
         max-height:260px; overflow:auto }
  .note { background:#fffbeb; border:1px solid #fde68a; color:#78350f;
          border-radius:.6rem; padding:.9rem 1rem; font-size:.9rem; margin-top:1.25rem }
  .ok   { color:var(--ok) }   .bad { color:var(--bad) }
  .spin { width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--brand);
          border-radius:50%; animation:sp .8s linear infinite; margin:0 auto }
  @keyframes sp { to { transform:rotate(360deg) } }
  @media (prefers-reduced-motion:reduce) { .spin { animation:none } }
</style>
</head>
<body>
<div class="wrap">

  <!-- loading -->
  <div class="card center" id="sLoading">
    <div class="spin"></div>
    <p class="sub" style="margin-top:1rem">טוען...</p>
  </div>

  <!-- not signed in -->
  <div class="card center" id="sLogin" style="display:none">
    <h1>גיבוי נתונים</h1>
    <p class="sub">יש להתחבר עם חשבון המנהל</p>
    <button onclick="doLogin()">כניסה עם Google</button>
    <div id="loginErr" class="bad" style="margin-top:1rem;font-size:.9rem"></div>
  </div>

  <!-- wrong account -->
  <div class="card center" id="sDenied" style="display:none">
    <h1>אין הרשאה</h1>
    <p class="sub">הדף זמין למנהל האתר בלבד</p>
    <button class="ghost" onclick="window._firebaseAuth.signOut()">יציאה</button>
  </div>

  <!-- the tool -->
  <div class="card" id="sMain" style="display:none">
    <h1>גיבוי נתונים</h1>
    <p class="sub">שומר עותק מלא של כל הנתונים כקובץ במחשב שלך</p>

    <div class="row"><span>משתמשים</span><b id="cUsers">—</b></div>
    <div class="row"><span>ילדים</span><b id="cKids">—</b></div>
    <div class="row"><span>בקשות תשלום</span><b id="cReqs">—</b></div>

    <p style="margin:1.5rem 0 0">
      <button id="btn" onclick="runBackup()">הורד גיבוי ←</button>
      <button class="ghost" onclick="window._firebaseAuth.signOut()">יציאה</button>
    </p>

    <div class="log" id="log" style="display:none"></div>

    <div class="note">
      שמור את הקובץ במקום קבוע — לא בתיקיית ההורדות. הוא מכיל את כל
      המשתמשים, הילדים וההתקדמות שלהם.
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// This page talks to Firestore directly and never calls a Cloud Function, so it
// keeps working while billing is disabled — which is exactly when a backup matters.
var ADMIN_EMAIL = 'ishaieran@gmail.com';

var firebaseConfig = {
    apiKey:            "AIzaSyDttv79Uf6CVsJob2S6xVyAOfE6hkvuq1U",
    authDomain:        "lamdani-eng.firebaseapp.com",
    projectId:         "lamdani-eng",
    storageBucket:     "lamdani-eng.firebasestorage.app",
    messagingSenderId: "95853150948",
    appId:             "1:95853150948:web:454dfcbfa89cc0ea5f62f1"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db   = firebase.firestore();
window._firebaseAuth = auth;

function show(id) {
    ['sLoading','sLogin','sDenied','sMain'].forEach(function(s) {
        document.getElementById(s).style.display = (s === id) ? 'block' : 'none';
    });
}

auth.onAuthStateChanged(function(user) {
    if (!user) { show('sLogin'); return; }
    if (user.email !== ADMIN_EMAIL) { show('sDenied'); return; }
    show('sMain');
    count();
});

function doLogin() {
    document.getElementById('loginErr').textContent = '';
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .catch(function(e) {
            if (e.code === 'auth/popup-closed-by-user') return;
            document.getElementById('loginErr').textContent = 'שגיאה: ' + e.code;
        });
}

function say(msg, cls) {
    var el = document.getElementById('log');
    el.style.display = 'block';
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
}

// A quick read so the page states what it is about to save before saving it.
function count() {
    db.collection('users').get().then(function(snap) {
        var kids = 0;
        snap.forEach(function(d) {
            var k = d.data().kids;
            if (Array.isArray(k)) kids += k.length;
            else if (k && typeof k === 'object') kids += Object.keys(k).length;
        });
        document.getElementById('cUsers').textContent = snap.size;
        document.getElementById('cKids').textContent  = kids;
    }).catch(function(e) {
        document.getElementById('cUsers').textContent = 'שגיאה';
        say('count users failed: ' + e.code, 'bad');
    });

    db.collection('premiumRequests').get().then(function(snap) {
        document.getElementById('cReqs').textContent = snap.size;
    }).catch(function() {
        document.getElementById('cReqs').textContent = '0';
    });
}

// Firestore Timestamps do not survive JSON.stringify as anything readable, so
// they are converted to ISO strings on the way out.
function plain(v) {
    if (v === null || typeof v !== 'object') return v;
    if (typeof v.toDate === 'function') return v.toDate().toISOString();
    if (Array.isArray(v)) return v.map(plain);
    var out = {};
    Object.keys(v).forEach(function(k) { out[k] = plain(v[k]); });
    return out;
}

function grab(name) {
    return db.collection(name).get().then(function(snap) {
        var docs = {};
        snap.forEach(function(d) { docs[d.id] = plain(d.data()); });
        say('  ' + name + ': ' + snap.size + ' docs', 'ok');
        return docs;
    });
}

function runBackup() {
    var btn = document.getElementById('btn');
    btn.disabled = true;
    document.getElementById('log').innerHTML = '';
    say('reading Firestore...');

    Promise.all([grab('users'), grab('premiumRequests')]).then(function(res) {
        var dump = {
            _backup: {
                takenAt: new Date().toISOString(),
                project: firebaseConfig.projectId,
                by:      auth.currentUser.email,
                note:    'Full Firestore export. Restore with the Firebase Admin SDK.'
            },
            users:           res[0],
            premiumRequests: res[1]
        };

        var text = JSON.stringify(dump, null, 2);
        var stamp = new Date().toISOString().slice(0, 10);
        var blob = new Blob([text], { type: 'application/json' });
        var url  = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'lamdani-backup-' + stamp + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 10000);

        say('');
        say('saved: ' + a.download + '  (' + Math.round(text.length / 1024) + ' KB)', 'ok');
        btn.disabled = false;
    }).catch(function(e) {
        say('');
        say('FAILED: ' + (e.code || e.message), 'bad');
        say('If this says permission-denied, sign in with the admin account.', 'bad');
        btn.disabled = false;
    });
}
</script>
</body>
</html>
