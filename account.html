        .badge-cancelled { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 0.2rem 0.75rem; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
        .btn-subscribe { display: block; width: 100%; padding: 0.85rem; background: #2563eb; color: #fff; border: none; border-radius: 50px; font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit; margin-top: 1rem; }
        .btn-subscribe:hover { opacity: 0.9; }

        .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .info-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 0.9rem 1.1rem; font-size: 0.9rem; color: #166534; margin-top: 0.75rem; }
        .warn-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 0.9rem 1.1rem; font-size: 0.9rem; color: #92400e; margin-top: 0.75rem; }
        .btn-settings { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0.7rem 0.9rem; background: #f8fafc; color: #334155; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 0.92rem; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 1rem; transition: background 0.15s; }
        .btn-settings:hover { background: #f1f5f9; }
        .sub-modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
        .sub-modal-backdrop.open { display: flex; }
        .sub-modal { background: #fff; border-radius: 18px; width: 100%; max-width: 420px; box-shadow: 0 8px 40px rgba(0,0,0,0.18); animation: modalIn 0.22s ease; overflow: hidden; }
        @keyframes modalIn { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: none; } }
        .sub-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 1.5rem 1rem; border-bottom: 1px solid #f1f5f9; }
        .sub-modal-title { font-size: 1.05rem; font-weight: 800; color: #0f172a; }
        .sub-modal-close { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #94a3b8; line-height: 1; padding: 0 0.25rem; }
        .sub-modal-close:hover { color: #334155; }
        .sub-modal-body { padding: 1rem 1.5rem 1.5rem; }
        .err-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 0.9rem 1.1rem; font-size: 0.9rem; color: #dc2626; margin-top: 0.75rem; }
        .btn-link { background: none; border: none; color: #2563eb; font-size: 0.88rem; font-weight: 600; cursor: pointer; font-family: inherit; padding: 0.4rem 0; text-decoration: underline; display: block; width: 100%; text-align: right; margin-top: 0.5rem; }

<script>
var CANCEL_FN = 'https://cancelsubscription-2tarox7bha-uc.a.run.app';
var PAYMENT_FN = 'https://createpaymentsession-2tarox7bha-uc.a.run.app';
var DELETE_FN  = 'https://us-central1-lamdani-eng.cloudfunctions.net/deleteAccount';
var _fbUser = null;

function fmtDate(ts) {
    if (!ts || !ts.toDate) return '—';
    var d = ts.toDate();
    return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
}

function renderSubscription(data, fbUser) {
    var el = document.getElementById('accSubContent');
    var isPremium = !!data.premium;
    var isCancelled = !!data.cancelAtPeriodEnd;
    var since = data.premiumSince ? fmtDate(data.premiumSince) : null;
    var expiry = data.premiumExpiry ? fmtDate(data.premiumExpiry) : null;
    var last4 = data.last4 || null;

    if (!isPremium) {
        var noSubHtml = '<div class="acc-row"><span class="acc-lbl">סטטוס</span>';
        if (data.chargeFailedAt) {
            noSubHtml += '<span class="badge-cancelled">חיוב נכשל</span></div>' +
                '<div class="err-box">החיוב החודשי לא הצליח וגישתך לתכנים הושעתה. ניתן לחדש את המנוי.</div>';
        } else {
            noSubHtml += '<span class="badge-free">ללא מנוי</span></div>';
        }
        noSubHtml += '<button class="btn-subscribe" onclick="goSubscribe()">רכוש מנוי — 35 ₪ לחודש ←</button>';
        el.innerHTML = noSubHtml;
        return;
    }

    // Status row only — always visible
    var html =
        '<div class="acc-row"><span class="acc-lbl">סטטוס</span>' +
        (isCancelled
            ? '<span class="badge-cancelled">מבוטל — פעיל עד סיום התקופה</span>'
            : '<span class="badge-premium">⭐ פעיל</span>') +
        '</div>';

    if (isCancelled) {
        html += '<div class="warn-box">המנוי בוטל ויסתיים בתאריך ' + (expiry || '—') + '. עד אז תוכל להמשיך להשתמש בכל התכנים.</div>';
    }

    // Settings modal button
    html += '<button class="btn-settings" onclick="openSubModal()">' +
        '<span>אפשרויות והגדרות מנוי</span>' +
        '<span>←</span>' +
        '</button>';

    // Build modal content
    var details = '';
    if (since) details += '<div class="acc-row"><span class="acc-lbl">תחילת מנוי</span><span class="acc-val">' + since + '</span></div>';
    if (expiry) details += '<div class="acc-row"><span class="acc-lbl">' + (isCancelled ? 'פעיל עד' : 'חידוש הבא') + '</span><span class="acc-val">' + expiry + '</span></div>';
    details += '<div class="acc-row"><span class="acc-lbl">עלות חודשית</span><span class="acc-val">35 ₪</span></div>';
    if (last4) details += '<div class="acc-row"><span class="acc-lbl">כרטיס</span><span class="acc-val" style="direction:ltr">•••• ' + last4 + '</span></div>';

    if (!isCancelled) {
        details +=
            '<button class="btn-cancel" onclick="doCancelSubscription()">בטל מנוי</button>' +
            '<p class="cancel-note">הביטול ייכנס לתוקף בסוף תקופת החיוב הנוכחית.<br>לא יחויב כרטיסך מחדש.</p>';
    }

    el.innerHTML = html;

    // Inject modal into body (once)
    if (!document.getElementById('subModal')) {
        var backdrop = document.createElement('div');
        backdrop.className = 'sub-modal-backdrop';
        backdrop.id = 'subModalBackdrop';
        backdrop.innerHTML =
            '<div class="sub-modal" id="subModal">' +
                '<div class="sub-modal-header">' +
                    '<span class="sub-modal-title">הגדרות מנוי</span>' +
                    '<button class="sub-modal-close" onclick="closeSubModal()">✕</button>' +
                '</div>' +
                '<div class="sub-modal-body">' + details + '</div>' +
            '</div>';
        backdrop.addEventListener('click', function(e) { if (e.target === backdrop) closeSubModal(); });
        document.body.appendChild(backdrop);
    }
}

function openSubModal() {
    var b = document.getElementById('subModalBackdrop');
    if (b) b.classList.add('open');
}

function closeSubModal() {
    var b = document.getElementById('subModalBackdrop');
    if (b) b.classList.remove('open');
}

function loadAccount(fbUser) {
    _fbUser = fbUser;
    document.getElementById('accName').textContent = fbUser.displayName || fbUser.email.split('@')[0];
    document.getElementById('accEmail').textContent = fbUser.email || '—';

    firebase.firestore().collection('users').doc(fbUser.uid).get().then(function(doc) {
        document.getElementById('accLoader').style.display = 'none';
        document.getElementById('accContent').style.display = 'block';
        renderSubscription(doc.exists ? doc.data() : {}, fbUser);
    }).catch(function() {
        document.getElementById('accLoader').innerHTML = '<p style="color:#ef4444">שגיאה בטעינת נתוני חשבון</p>';
    });
}

function goSubscribe() {
    if (!_fbUser) return;
    var btn = document.querySelector('.btn-subscribe');
    btn.textContent = 'טוען...'; btn.disabled = true;
    _fbUser.getIdToken().then(function(token) {
        return fetch(PAYMENT_FN, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
    }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.url) window.location.href = data.url;
        else { alert('שגיאה: ' + (data.error || 'לא ניתן לפתוח עמוד תשלום')); btn.textContent = 'רכוש מנוי — 35 ₪ לחודש ←'; btn.disabled = false; }
    }).catch(function() { alert('שגיאת תקשורת'); btn.textContent = 'רכוש מנוי — 35 ₪ לחודש ←'; btn.disabled = false; });
}

function doCancelSubscription() {
    if (!_fbUser) return;
    if (!confirm('לבטל את המנוי?\n\nתוכל להמשיך להשתמש בתכנים עד סוף תקופת החיוב הנוכחית.')) return;
    var btn = document.querySelector('.btn-cancel');
    btn.textContent = 'מבטל...'; btn.disabled = true;
    _fbUser.getIdToken().then(function(token) {
        return fetch(CANCEL_FN, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
    }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.success) {
            firebase.firestore().collection('users').doc(_fbUser.uid).update({ cancelAtPeriodEnd: true })
                .then(function() { loadAccount(_fbUser); });
        } else {
            alert('שגיאה בביטול — פנה לצור קשר');
            btn.textContent = 'בטל מנוי'; btn.disabled = false;
        }
    }).catch(function() { alert('שגיאת תקשורת'); btn.textContent = 'בטל מנוי'; btn.disabled = false; });
}

function doChangePassword() {
    if (!_fbUser || !_fbUser.email) return;
    var msg = document.getElementById('changePwdMsg');
    msg.style.color = '#64748b'; msg.textContent = 'שולח...';
    window._firebaseAuth.sendPasswordResetEmail(_fbUser.email)
        .then(function() {
            msg.style.color = '#16a34a';
            msg.textContent = '✅ קישור לשינוי סיסמה נשלח למייל שלך.';
        })
        .catch(function() {
            msg.style.color = '#ef4444';
            msg.textContent = 'שגיאה בשליחה — נסה שוב.';
        });
}

function doDeleteAccount() {
    if (!_fbUser) return;
    if (!confirm('למחוק את החשבון לצמיתות?\n\nפעולה זו אינה הפיכה. כל הנתונים שלך יימחקו.')) return;
    var btn = event.target;
    btn.textContent = 'מוחק...'; btn.disabled = true;
    _fbUser.getIdToken().then(function(token) {
        return fetch(DELETE_FN, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
    }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.ok) {
            localStorage.removeItem('lmd_auth');
            window.location.href = 'index.html';
        } else {
            alert('שגיאה במחיקה — פנה לצור קשר');
            btn.textContent = 'מחק חשבון לצמיתות'; btn.disabled = false;
        }
    }).catch(function() {
        alert('שגיאת תקשורת — נסה שוב');
        btn.textContent = 'מחק חשבון לצמיתות'; btn.disabled = false;
    });
}

window.onFirebaseAuth = function(fbUser) { loadAccount(fbUser); };
window.onFirebaseLogout = function() { window.location.href = 'index.html'; };
setTimeout(function() {
    if (document.getElementById('accLoader').style.display !== 'none')
        window.location.href = 'index.html';
}, 5000);
</script>

<script>
(function() {
    var fontSize = 0, contrast = false, links = false;
    function applyA11y() {
        document.documentElement.style.fontSize = fontSize ? (100 + fontSize * 10) + '%' : '';
        document.body.classList.toggle('a11y-contrast', contrast);
        document.body.classList.toggle('a11y-links', links);
        document.getElementById('a11yContrast').classList.toggle('active', contrast);
        document.getElementById('a11yLinks').classList.toggle('active', links);
    }
    window.toggleA11yPanel = function() { document.getElementById('a11yPanel').classList.toggle('open'); };
    window.a11yFontSize = function(d) { fontSize = Math.max(-2, Math.min(4, fontSize + d)); applyA11y(); };
    window.a11yToggleContrast = function() { contrast = !contrast; applyA11y(); };
    window.a11yToggleLinks    = function() { links = !links; applyA11y(); };
    window.a11yReset = function() { fontSize = 0; contrast = false; links = false; applyA11y(); document.getElementById('a11yPanel').classList.remove('open'); };
    document.addEventListener('click', function(e) { var w = document.querySelector('.a11y-widget'); if (w && !w.contains(e.target)) document.getElementById('a11yPanel').classList.remove('open'); });
})();
function toggleNavMenu() { document.getElementById('navMenuPanel').classList.toggle('open'); }
document.addEventListener('click', function(e) { var p = document.getElementById('navMenuPanel'); var b = document.getElementById('navMenuBtn'); if (p && !p.contains(e.target) && b && !b.contains(e.target)) p.classList.remove('open'); });
</script>
